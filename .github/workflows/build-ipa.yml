name: Build IPA (Direct Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Xcode 环境
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 预处理工程与清除虚构 API
        run: |
          # 1. 解压源码包（如果有 zip）
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;

          # 2. 定位源码目录并统一命名为 AppSource
          TARGET_DIR=$(find . -name "Package.swift" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ 未找到 Package.swift"
            exit 1
          fi
          rm -rf AppSource
          mv "$TARGET_DIR" AppSource

          # 3. 清理重复的 Assets
          find AppSource -name "Assets.xcassets" | tail -n +2 | while read -r dup; do rm -rf "$dup"; done

          # 4. 目标版本规范为 17.0
          sed -i '' 's/\.iOS("18.0")/\.iOS("17.0")/g' AppSource/Package.swift || true

          # 5. 核心修复：运行 Python 脚本自动清理所有不存在的虚构 iOS 26 API
          python3 - << 'EOF'
          import os, re

          for root, _, files in os.walk('AppSource'):
              for file in files:
                  if file.endswith('.swift'):
                      fpath = os.path.join(root, file)
                      with open(fpath, 'r', encoding='utf-8') as f:
                          code = f.read()

                      # (1) 修复 MessagesChatDetailView 报错的 IOS26NativeBottomSafeAreaBar
                      code = re.sub(
                          r'struct IOS26NativeBottomSafeAreaBar<BarContent: View>: ViewModifier \{[\s\S]*?body\(content: Content\) -> some View \{[\s\S]*?\}\s*\}',
                          '''struct IOS26NativeBottomSafeAreaBar<BarContent: View>: ViewModifier {
    @ViewBuilder let barContent: () -> BarContent
    func body(content: Content) -> some View {
        content.safeAreaInset(edge: .bottom) {
            barContent()
        }
    }
}''',
                          code
                      )

                      # (2) 修复 principalHeaderItem 的 .sharedBackgroundVisibility
                      code = re.sub(
                          r'if #available\(iOS 26\.0, \*\)\s*\{\s*ToolbarItem\(placement: \.principal\)\s*\{\s*principalHeaderItem\s*\}\s*\.sharedBackgroundVisibility\(\.hidden\)\s*\}\s*else\s*\{',
                          'ToolbarItem(placement: .principal) { principalHeaderItem } //',
                          code
                      )

                      # (3) 修复 GlassEffectContainer 与 glassEffect 虚构语法
                      code = re.sub(
                          r'if #available\(iOS 26\.0, \*\)\s*\{\s*GlassEffectContainer[\s\S]*?\}\s*else\s*\{',
                          '',
                          code
                      )

                      # (4) 修复 HomeScreenView 等文件中的 applyLiquidGlassEffect 与 applyNativeAdaptiveGlass
                      code = re.sub(r'Color\.clear\.glassEffect\([^)]*\)', 'Color.clear', code)
                      code = re.sub(r'\.glassEffect\([^)]*\)', '', code)

                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(code)
          print("✅ 所有虚构 API 清理完成")
          EOF

      - name: 执行编译与制作直装包
        run: |
          cd AppSource

          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="AppModule"; fi
          echo "编译 Scheme: $SCHEME"

          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          APP_PATH=$(find ./build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到生成的 .app"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/

          PLIST_PATH=$(find Payload -name "Info.plist" | head -n 1)
          if [ -f "$PLIST_PATH" ]; then
            plutil -replace CFBundleIdentifier -string "com.youdong.app" "$PLIST_PATH"
            plutil -replace CFBundleName -string "幼刀" "$PLIST_PATH" || true
            plutil -replace CFBundleDisplayName -string "幼刀" "$PLIST_PATH" || true
          fi

          zip -qry output.ipa Payload
          mv output.ipa "$GITHUB_WORKSPACE/YouDao.ipa"
          echo "🎉 打包完成"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "幼刀 直装版 IPA (Build ${{ github.run_number }})"
          files: YouDao.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
